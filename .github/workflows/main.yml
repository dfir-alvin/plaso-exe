# Watches log2timeline/plaso for new releases and publishes a portable
# Windows onedir build (all five tools in one folder) as a release in THIS repo,
# tagged with the same version as upstream.
name: plaso-windows

on:
  schedule:
    - cron: "41 5 * * *"          # daily, UTC; plaso only releases a few times a year
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream plaso tag to build (blank = latest release)"
        required: false
      force:
        description: "Rebuild and replace even if a release already exists"
        type: boolean
        default: false

concurrency:
  group: plaso-windows
  cancel-in-progress: false

permissions:
  contents: read

env:
  UPSTREAM: log2timeline/plaso
  PYTHON_VERSION: "3.13"   # 3.14 currently lacks Windows wheels for yara-python and zstd

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      build: ${{ steps.cmp.outputs.build }}
    steps:
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-$(gh api "repos/$UPSTREAM/releases/latest" --jq .tag_name)}"
          [ -n "$tag" ] || { echo "could not determine upstream tag" >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Upstream tag: $tag"
      - id: cmp
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          FORCE: ${{ inputs.force }}
        run: |
          # Our own releases are the state: if one exists for this tag, we're done.
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 && [ "$FORCE" != "true" ]; then
            echo "Release $TAG already exists; nothing to do."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      TAG: ${{ needs.check.outputs.tag }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Keep test data byte-exact
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          path: recipe
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ env.TAG }}
          path: plaso
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install plaso, its dependencies and PyInstaller
        working-directory: plaso
        run: |
          python -m pip install --upgrade pip
          # --prefer-binary: every native dep (libyal py*, pytsk3, yara, zstd, lz4, zmq...)
          # has a win_amd64 wheel on PyPI; only pure-Python ones come as sdists.
          python -m pip install --prefer-binary . pyinstaller pywin32 pip-licenses
          python -m pip check

      - name: Build onedir bundle
        working-directory: plaso
        run: pyinstaller --noconfirm --clean ..\recipe\plaso.spec

      - name: Add licenses and docs
        working-directory: plaso
        run: |
          $dist = "dist\plaso"
          Copy-Item ACKNOWLEDGEMENTS, AUTHORS, LICENSE, README.md $dist
          pip-licenses --from=mixed --with-urls --with-license-file --no-license-path `
            --format=plain-vertical --output-file "$dist\THIRD_PARTY_LICENSES.txt"

      - name: Smoke test (extract, inspect, sort)
        working-directory: plaso
        run: |
          $d = "dist\plaso"
          & "$d\log2timeline.exe" --version
          if ($LASTEXITCODE) { throw "log2timeline --version failed" }
          & "$d\log2timeline.exe" --status-view none --vss_stores none `
            --storage-file "$env:RUNNER_TEMP\t.plaso" test_data\vsstest.qcow2
          if ($LASTEXITCODE) { throw "log2timeline extraction failed" }
          & "$d\pinfo.exe" "$env:RUNNER_TEMP\t.plaso"
          if ($LASTEXITCODE) { throw "pinfo failed" }
          & "$d\psort.exe" --status-view none -o dynamic -w "$env:RUNNER_TEMP\t.csv" "$env:RUNNER_TEMP\t.plaso"
          if ($LASTEXITCODE) { throw "psort failed" }
          $lines = (Get-Content "$env:RUNNER_TEMP\t.csv").Count
          Write-Host "psort wrote $lines lines"
          if ($lines -lt 100) { throw "suspiciously few events ($lines) - parsers or data files missing?" }
          & "$d\image_export.exe" --help | Out-Null
          & "$d\psteal.exe" --help | Out-Null

      - name: Zip
        working-directory: plaso\dist
        run: |
          $zip = "plaso-$env:TAG-py$env:PYTHON_VERSION-amd64.zip"
          # Top-level folder inside the zip matches the zip name, like upstream's old releases.
          Rename-Item plaso "plaso-$env:TAG"
          Compress-Archive -Path "plaso-$env:TAG" -DestinationPath $zip -CompressionLevel Optimal
          (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() + "  $zip" | Out-File -Encoding ascii "$zip.sha256"
          Get-ChildItem $zip, "$zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: plaso-windows
          path: |
            plaso/dist/*.zip
            plaso/dist/*.sha256
          if-no-files-found: error

  release:
    needs: [check, build]
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.check.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: plaso-windows
      - name: Publish release
        run: |
          notes="Unofficial portable Windows build of [plaso $TAG](https://github.com/$UPSTREAM/releases/tag/$TAG).

          Unzip anywhere and run \`log2timeline.exe\`, \`psort.exe\`, \`pinfo.exe\`, \`psteal.exe\` or \`image_export.exe\` from the folder. Python $PYTHON_VERSION, PyInstaller onedir, amd64. No installation or Python needed.

          Built by ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" *.zip *.sha256 --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" *.zip *.sha256 -R "$GITHUB_REPOSITORY" \
              --title "plaso $TAG (Windows portable)" --notes "$notes" --latest
          fi
